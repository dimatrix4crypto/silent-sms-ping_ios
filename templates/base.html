<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Smartphone Tracking Platform{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { background: #0d1117; }
    .navbar-brand { font-weight: 700; letter-spacing: 1px; }
    .card { border: 1px solid #30363d; background: #161b22; }
    .card-header { background: #1c2128; border-bottom: 1px solid #30363d; font-weight: 600; }
    .table { --bs-table-bg: transparent; }
    .badge-online { background: #238636; }
    .event-row:hover { background: #1c2128 !important; cursor: pointer; }
    #map { height: 400px; border-radius: 8px; }
    .stat-card { border-left: 3px solid #388bfd; }
    .gps-badge { background: #238636; }
    .ip-badge { background: #9e6a03; }
    pre { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; font-size: 0.8rem; }
    .token-pill { font-family: monospace; font-size: 0.85rem; background: #1c2128; border: 1px solid #30363d; border-radius: 20px; padding: 2px 10px; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background:#161b22; border-bottom:1px solid #30363d;">
  <div class="container-fluid">
    <a class="navbar-brand text-info" href="/"><i class="bi bi-crosshair2"></i> TrackOps</a>
    <span class="badge bg-warning text-dark ms-2">LKA Wettbewerb Demo</span>
  </div>
</nav>
<div class="container-fluid py-4">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
